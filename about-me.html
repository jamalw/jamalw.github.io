<!DOCTYPE HTML>
<html>

<head>
    <title>Jamal A. Williams | Personal Website</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="description" content="Personal website of Jamal A. Williams" />
    <meta name="keywords" content="neuroscience, cognitive neuroscience, research" />
    <link rel="stylesheet" href="assets/css/main.css" />
    <style>
        .profile-pic {
            width: 200px;
            border-radius: 50%;
            border: 2px solid #fff;
            margin: 20px;
        }

        .brain-logo {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 220px;
        }

        .pattern-matrix {
            position: absolute;
            top: 20px;
            left: 20px;
            width: 150px;
        }

        .main-section {
            background-color: white;
            padding: 2rem;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin: 0 auto;
            max-width: 1000px;
            position: relative;
            top: 150px;
        }

        .header-name {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 48px;
            font-weight: bold;
        }

        .nav-bar {
            background-color: white;
            text-align: center;
            padding: 1rem 0;
            border-bottom: 1px solid #e0e0e0;
        }

        .nav-bar ul {
            padding: 0;
            margin: 0;
            list-style-type: none;
            display: flex;
            justify-content: center;
        }

        .nav-bar ul li {
            margin: 0 1rem;
        }

        .nav-bar ul li a {
            text-decoration: none;
            font-weight: bold;
            color: #333;
        }

        .nav-bar ul li a:hover {
            text-decoration: underline;
        }

        section {
            margin-top: 2rem;
        }

        section h2 {
            border-bottom: 2px solid #e0e0e0;
            padding-bottom: 0.5rem;
            text-align: center;
        }

        section p {
            line-height: 1.6;
            color: #333;
        }

        .about-section {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        .about-section .text-content {
            flex: 1;
            padding-right: 20px;
            max-width: 700px;
        }

        .about-section .profile-container {
            flex-shrink: 0;
            align-self: flex-start;
        }
    </style>
</head>

<body class="is-preload">

    <div id="wrapper">

        <img src="images/brain_with_curved_staff.png" alt="Brain Logo" class="brain-logo" />
        <div class="header-name">Jamal A. Williams</div>

        <div class="main-section">
            <div class="nav-bar">
                <ul>
                    <li><a href="about-me.html">About Me</a></li>
                    <li><a href="publications.html">Publications</a></li>
                    <li><a href="cv.html">CV</a></li>
                    <li><a href="music.html">Music</a></li>
                </ul>
            </div>

            <section id="about-me">
                <div class="about-heading">
                    <h2>About Me</h2>
                </div>
                <div class="about-section">
                    <div class="profile-container">
                        <img src="images/webpage_photo_1.png" alt="Profile Picture" class="profile-pic" />
                    </div>
                    <div class="text-content">
                        <p id="about-me-content">Loading About Me...</p>
                        <script>
                            fetch('about_me.txt')
                                .then(response => response.text())
                                .then(data => {
                                    document.getElementById('about-me-content').innerText = data;
                                })
                                .catch(error => {
                                    document.getElementById('about-me-content').innerText = "Error loading About Me content.";
                                    console.error('Error:', error);
                                });
                        </script>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="assets/js/jquery.min.js"></script>
    <script src="assets/js/jquery.scrolly.min.js"></script>
    <script src="assets/js/browser.min.js"></script>
    <script src="assets/js/breakpoints.min.js"></script>
    <script src="assets/js/util.js"></script>
    <script src="assets/js/main.js"></script>

</body>

</html>
